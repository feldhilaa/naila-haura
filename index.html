<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congrast Bestt</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:#DCC9F5;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:Arial,sans-serif;
}
#cover{
  position:fixed;
  inset:0;
  z-index:999;
  transition:opacity .6s ease;
}

#cover.hide{
  opacity:0;
  pointer-events:none;
}
/* FRAME 9:16 */
.page{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#DCC9F5;
}
.frame{
  width:100%;
  height:100%;
  position:relative;
}
  video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;   /* Full layar */
  display:block;
}
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:120px; /* Jarak dari bawah */
  z-index:20;
}

#main{display:none;}

.open-btn{
padding:14px 40px;
border:none;
border-radius:999px;
background:#D8B4FE;
color:#4C1D95;
font-weight:bold;
font-size:16px;
cursor:pointer;
box-shadow:0 8px 20px rgba(216,180,254,.45);
transition:.3s;
}

.open-btn:hover{
background:#C084FC;
transform:scale(1.05);
}
  #musicBtn{
  position:fixed;
  right:18px;
  bottom:20px;
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#B48AE6;
  color:white;
  font-size:22px;
  z-index:1000;
  }

/* COUNTDOWN */

.countdown{
  position:absolute;
  bottom:110px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:20;
}
.box{
background:rgba(255,255,255,.20);
backdrop-filter:blur(10px);
border-radius:14px;
padding:10px;
min-width:55px;
text-align:center;
color:white;
}

.box h3{
font-size:20px;
}

.box small{
font-size:10px;
}
</style>
</head>
<button id="musicBtn" onclick="toggleMusic()">🎵</button>
<body>

<audio id="bgMusic" preload="auto" loop>
  <source src="Sahabat Tak Akan Pergi.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">🎵</button>

<!-- HALAMAN 1 -->
<!-- HALAMAN 1 -->
<div id="cover" class="page">
  <div class="frame">

    <video autoplay muted loop playsinline>
      <source src="1.mp4" type="video/mp4">
    </video>

    <div class="overlay">
      <button class="open-btn" onclick="openPage()">OPEN</button>
    </div>

  </div>
</div>

<!-- ISI WEB -->
<div id="main" style="display:none;">

<!-- HALAMAN 2 -->
<div class="page" id="page2">
<div class="frame">

<video autoplay muted loop playsinline>
<source src="2.mp4" type="video/mp4">
</video>

</div>
</div>

<!-- HALAMAN 3 -->
<div class="page">
<div class="frame">

<video autoplay muted loop playsinline>
<source src="3.mp4" type="video/mp4">
</video>

</div>
</div>

<!-- HALAMAN 4 (COUNTDOWN) -->
<div class="page">
<div class="frame">

<video autoplay muted loop playsinline>
<source src="4.mp4" type="video/mp4">
</video>

<div class="countdown">

<div class="box">
<h3 id="hari">0</h3>
<small>Hari</small>
</div>

<div class="box">
<h3 id="jam">0</h3>
<small>Jam</small>
</div>

<div class="box">
<h3 id="menit">0</h3>
<small>Menit</small>
</div>

<div class="box">
<h3 id="detik">0</h3>
<small>Detik</small>
</div>

</div>

</div>
</div>

<!-- HALAMAN 5 -->
<div class="page">
<div class="frame">

<video autoplay muted loop playsinline>
<source src="5.mp4" type="video/mp4">
</video>

</div>
</div>

</div>

<script>
  function openPage() {
  const music = document.getElementById("bgMusic");
  music.play().catch(() => {});

  document.getElementById("cover").classList.add("hide");

  setTimeout(() => {
    document.getElementById("cover").style.display = "none";
    document.getElementById("main").style.display = "block";
document.body.style.overflowY = "auto";
    document.querySelectorAll("#main video").forEach(v => {
      v.play().catch(() => {});
    });
  }, 600);
  }
  
  function toggleMusic(){
  const music=document.getElementById("bgMusic");
  music.paused ? music.play() : music.pause();
  }
/* Countdown ke 27 September 2026 */

const target=new Date("2026-09-27T00:00:00").getTime();

setInterval(()=>{

let now=new Date().getTime();
let diff=target-now;

if (diff <= 0) {
  document.querySelector(".countdown").innerHTML = `
    <div style="
      background:rgba(255,255,255,.18);
      backdrop-filter:blur(12px);
      border-radius:18px;
      padding:18px;
      color:white;
      text-align:center;
      max-width:300px;">
      <h3 style="margin-bottom:8px;">🌸Hari istimewa itu akhirnya tiba.</h3>
      <p style="font-size:14px;line-height:1.6;">
        Langkah baru dimulai. Semoga setiap jejakmu dipenuhi kemudahan, ketenangan, dan cerita-cerita baik🌿
      </p>
    </div>
  `;
  return;
}

document.getElementById("hari").textContent=Math.floor(diff/86400000);
document.getElementById("jam").textContent=Math.floor((diff%86400000)/3600000);
document.getElementById("menit").textContent=Math.floor((diff%3600000)/60000);
document.getElementById("detik").textContent=Math.floor((diff%60000)/1000);

},1000);
</script>

</body>
</html>
